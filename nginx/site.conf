# XLADA — виртуальный хост основного домена.
#
# Отдаёт статику: логотип по /img/logo.svg (на него ссылается страница
# подписки) и небольшую страницу-визитку. Сюда же позже можно положить
# документацию.
#
# Установка (от root):
#   mkdir -p /var/www/xlada
#   cp -a deploy/xlada-site/. /var/www/xlada/
#   cp deploy/nginx-xlada-site.conf /etc/nginx/sites-available/xlada-site
#   ln -sf /etc/nginx/sites-available/xlada-site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d xlada.app -d www.xlada.app
#
# Домен проксируется через Cloudflare, поэтому сертификат на источнике
# выпускается так же, как для остальных хостов.

server {
    server_name xlada.app www.xlada.app;

    root /var/www/xlada;
    index index.html;

    # Логотип запрашивается со страницы подписки, поэтому отдаём его с
    # разрешённым кросс-доменным доступом и без кеша на время правок.
    location /img/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
