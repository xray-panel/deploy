# XLADA — виртуальный хост страницы подписки.
#
# Страница подписки, как и панель, требует HTTPS: в её коде есть middleware,
# который разрывает соединение, если нет заголовков X-Forwarded-For и
# X-Forwarded-Proto: https. Поэтому проксирование обязательно.
#
# Установка (от root):
#   cp deploy/nginx-subpage.conf /etc/nginx/sites-available/xlada-subpage
#   ln -sf /etc/nginx/sites-available/xlada-subpage /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d subka.kitten443.dev
#
# certbot сам допишет блок с сертификатом и перенаправление с 80 на 443.
#
# Перед этим убедитесь, что контейнер поднят: docker compose up -d xpanel-subpage

server {
    server_name subka.kitten443.dev;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
    }
}
