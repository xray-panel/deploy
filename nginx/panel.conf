# XPANEL — виртуальный хост панели.
#
# Панель требует HTTPS: в её коде есть middleware, который разрывает соединение,
# если нет заголовков X-Forwarded-For и X-Forwarded-Proto: https. Поэтому
# проксирование обязательно, а не опционально.
#
# Установка (от root):
#   cp deploy/nginx-panel.conf /etc/nginx/sites-available/xpanel-panel
#   ln -sf /etc/nginx/sites-available/xpanel-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d panel.kitten443.dev
#
# certbot сам допишет блок с сертификатом и перенаправление с 80 на 443.

server {
    server_name panel.kitten443.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket нужен для SSH-терминала к нодам
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    listen 80;
    listen [::]:80;
}
